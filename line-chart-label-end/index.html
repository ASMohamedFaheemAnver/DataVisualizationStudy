<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3 Line Chart with End Labels</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <style>
      .line {
        fill: none;
        stroke-width: 2px;
      }
    </style>
  </head>
  <body>
    <svg width="800" height="400"></svg>
    <script>
      const data = [
        {
          name: "Series 1",
          values: [
            { date: new Date(2020, 0, 1), value: 30 },
            { date: new Date(2020, 1, 1), value: 50 },
            { date: new Date(2020, 2, 1), value: 70 },
          ],
        },
        {
          name: "Series 2",
          values: [
            { date: new Date(2020, 0, 1), value: 20 },
            { date: new Date(2020, 1, 1), value: 40 },
            { date: new Date(2020, 2, 1), value: 60 },
          ],
        },
      ];

      const svg = d3.select("svg"),
        margin = { top: 20, right: 80, bottom: 30, left: 50 },
        width = svg.attr("width") - margin.left - margin.right,
        height = svg.attr("height") - margin.top - margin.bottom;

      const parseTime = d3.timeParse("%Y-%m-%d");

      const x = d3.scaleTime().range([0, width]);
      const y = d3.scaleLinear().range([height, 0]);

      const line = d3
        .line()
        .x((d) => x(d.date))
        .y((d) => y(d.value));

      const g = svg
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      x.domain([
        d3.min(data, (c) => d3.min(c.values, (d) => d.date)),
        d3.max(data, (c) => d3.max(c.values, (d) => d.date)),
      ]);

      y.domain([
        d3.min(data, (c) => d3.min(c.values, (d) => d.value)),
        d3.max(data, (c) => d3.max(c.values, (d) => d.value)),
      ]);

      g.append("g")
        .attr("class", "axis axis--x")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(x));

      g.append("g").attr("class", "axis axis--y").call(d3.axisLeft(y));

      const series = g
        .selectAll(".series")
        .data(data)
        .enter()
        .append("g")
        .attr("class", "series");

      series
        .append("path")
        .attr("class", "line")
        .attr("d", (d) => line(d.values))
        .style("stroke", (d, i) => d3.schemeCategory10[i]);

      // Adding labels at the end of each line
      series
        .append("text")
        .datum((d) => ({ name: d.name, value: d.values[d.values.length - 1] }))
        .attr(
          "transform",
          (d) => `translate(${x(d.value.date)},${y(d.value.value)})`
        )
        .attr("x", 5)
        .attr("dy", "0.35em")
        .style("font", "10px sans-serif")
        .text((d) => d.name);
    </script>
  </body>
</html>
